name: Builder Journey Smoke

on:
  push:
    branches: [main]
    paths:
      - 'apps/builder/**'
      - 'packages/**'
      - 'qa/builder-journey.spec.ts'
      - 'playwright.builder.config.ts'
      - '.github/workflows/builder-smoke.yml'
  pull_request:
    paths:
      - 'apps/builder/**'
      - 'packages/**'
      - 'qa/builder-journey.spec.ts'
      - 'playwright.builder.config.ts'
      - '.github/workflows/builder-smoke.yml'

concurrency:
  group: builder-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config=playwright.builder.config.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: builder-smoke-report
          path: playwright-builder-report
          if-no-files-found: ignore
