name: Cloudflare Content Canary

on:
  push:
    branches: [fix/onboarding-use-guarded-content]
    paths:
      - '.github/workflows/cloudflare-content-canary.yml'
      - 'apps/builder/app/api/internal/cloudflare-content-canary/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-content-canary.yml'
      - 'apps/builder/app/api/internal/cloudflare-content-canary/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: https://buodqfijzaqmzbkghche.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6HLaWSmycSxj3Dd2wKrcpg_Xw0ywbq7
      MICIRQL_DRAFT_STORE: supabase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Builder Worker
        working-directory: apps/builder
        run: pnpm exec opennextjs-cloudflare build

      - name: Start remote Worker preview with AI binding
        working-directory: apps/builder
        shell: bash
        run: |
          pnpm exec wrangler dev --remote --port 8787 > /tmp/wrangler-content-canary.log 2>&1 &
          echo $! > /tmp/wrangler-content-canary.pid
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:8787/; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wrangler-content-canary.log
          exit 1

      - name: Generate grounded Dental website copy through Worker binding
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:8787/api/internal/cloudflare-content-canary \
            > /tmp/cloudflare-response.json || {
              echo '--- Wrangler log ---'
              cat /tmp/wrangler-content-canary.log
              exit 1
            }
          cat /tmp/cloudflare-response.json

      - name: Validate structured copy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/cloudflare-response.json', 'utf8'));
          if (!payload.ok) throw new Error(`Worker binding inference failed: ${JSON.stringify(payload)}`);
          const content = payload?.result?.output ?? payload?.result;
          const required = [
            ['hero.h1', content?.hero?.h1],
            ['hero.p', content?.hero?.p],
            ['hero.cta', content?.hero?.cta],
            ['services.h2', content?.services?.h2],
            ['services.h3', content?.services?.h3],
            ['services.p', content?.services?.p],
          ];
          for (const [field, value] of required) {
            if (typeof value !== 'string' || !value.trim()) throw new Error(`${field} is missing`);
          }
          const words = (value) => value.trim().split(/\s+/).filter(Boolean).length;
          if (words(content.hero.h1) > 12) throw new Error(`hero.h1 too long: ${content.hero.h1}`);
          if (words(content.services.h2) > 10 || words(content.services.h3) > 10) throw new Error('section heading too long');
          if (words(content.hero.p) > 35 || words(content.services.p) > 35) throw new Error('paragraph too long');
          if (words(content.hero.cta) < 2 || words(content.hero.cta) > 4) throw new Error(`CTA length invalid: ${content.hero.cta}`);
          const joined = JSON.stringify(content).toLowerCase();
          const forbidden = [
            /award[- ]winning/,
            /\b\d+\+?\s+years?\b/,
            /\b100%\b/,
            /guaranteed/,
            /#1/,
            /best in hyderabad/,
            /\bexpert\b/,
            /\bexperienced\b/,
            /\brenowned\b/,
            /\bhighly skilled\b/,
            /\btrusted\b/,
            /\bleading\b/,
            /\bbest possible\b/,
          ];
          for (const pattern of forbidden) if (pattern.test(joined)) throw new Error(`unsupported claim detected: ${pattern}`);
          fs.writeFileSync('/tmp/content.json', JSON.stringify(content, null, 2));
          console.log(JSON.stringify(content, null, 2));
          NODE

      - name: Add canary summary
        if: always()
        shell: bash
        run: |
          echo '## Cloudflare Workers AI binding canary' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f /tmp/content.json ]]; then
            echo '**PASS** — remote Worker AI binding returned valid schema-shaped Dental copy.' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/content.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**FAIL** — no validated content payload was produced.' >> "$GITHUB_STEP_SUMMARY"
            if [[ -f /tmp/wrangler-content-canary.log ]]; then
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo 'Wrangler remote preview did not produce a passing AI response.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Stop remote preview
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/wrangler-content-canary.pid ]]; then
            kill "$(cat /tmp/wrangler-content-canary.pid)" 2>/dev/null || true
          fi
