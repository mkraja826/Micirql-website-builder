name: Dental Layout Blueprint Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/builder/app/apply-layout-blueprint.ts"
      - "apps/builder/app/renderer-preview.tsx"
      - "apps/builder/app/layout.tsx"
      - "apps/builder/app/editor-layout-guard.css"
      - "packages/design-engine/src/website-layout-blueprints.ts"
      - "packages/design-engine/src/dental-layout-blueprints.ts"
      - "packages/design-engine/src/layout-library.ts"
      - "packages/renderer/**"
      - "packages/sections/**"
      - "qa/dental-blueprint-qa.ts"
      - "qa/dental-layout-blueprint*.spec.ts"
      - "qa/dental-rendered-interaction-certification.spec.ts"
      - "qa/dental-interaction-allowlist-gate.spec.ts"
      - "qa/certify-dental-interactions.mjs"
      - "qa/certify-dental-top20-visual.mjs"
      - "playwright.dental-blueprint.config.ts"
      - "package.json"
      - ".github/workflows/dental-layout-blueprint.yml"
  push:
    branches: [main]
    paths:
      - "apps/builder/app/apply-layout-blueprint.ts"
      - "apps/builder/app/renderer-preview.tsx"
      - "apps/builder/app/layout.tsx"
      - "apps/builder/app/editor-layout-guard.css"
      - "packages/design-engine/src/website-layout-blueprints.ts"
      - "packages/design-engine/src/dental-layout-blueprints.ts"
      - "packages/design-engine/src/layout-library.ts"
      - "packages/renderer/**"
      - "packages/sections/**"
      - "qa/dental-blueprint-qa.ts"
      - "qa/dental-layout-blueprint*.spec.ts"
      - "qa/dental-rendered-interaction-certification.spec.ts"
      - "qa/dental-interaction-allowlist-gate.spec.ts"
      - "qa/certify-dental-interactions.mjs"
      - "qa/certify-dental-top20-visual.mjs"
      - "playwright.dental-blueprint.config.ts"
      - "package.json"
      - ".github/workflows/dental-layout-blueprint.yml"

jobs:
  certify-blueprints:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck blueprint layers
        run: |
          pnpm --filter @micirql/design-engine typecheck
          pnpm --filter @micirql/sections typecheck
          pnpm --filter @micirql/renderer typecheck
          pnpm --filter @micirql/builder typecheck
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run broader Dental blueprint regression suite
        continue-on-error: true
        run: pnpm qa:dental-blueprint
      - name: Certify curated Dental blueprints at six viewport widths
        id: dental_qa
        continue-on-error: true
        run: |
          pnpm exec playwright test --config=playwright.dental-blueprint.config.ts \
            qa/dental-layout-blueprint-00.spec.ts \
            qa/dental-layout-blueprint-0[4-9].spec.ts \
            qa/dental-layout-blueprint-1[0-9].spec.ts \
            qa/dental-layout-blueprint-20.spec.ts
      - name: Build final certification report
        if: always()
        shell: bash
        env:
          DENTAL_QA_OUTCOME: ${{ steps.dental_qa.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const expectedLayouts = 20;
          const expectedWidths = [360, 390, 430, 768, 1024, 1440];
          const root = 'dental-certification-results';
          const canonical = /^dental-layout-blueprint-(?:0[1-9]|1[0-9]|20)$/;
          const dirs = fs.existsSync(root)
            ? fs.readdirSync(root).filter((name) => canonical.test(name) && fs.existsSync(path.join(root, name, 'report.json'))).sort()
            : [];
          const failures = [];
          const layouts = [];

          if (dirs.length !== expectedLayouts) failures.push(`Expected ${expectedLayouts} canonical reports, found ${dirs.length}`);

          for (const dir of dirs) {
            const report = JSON.parse(fs.readFileSync(path.join(root, dir, 'report.json'), 'utf8'));
            const results = report.results || [];
            const widths = results.map((item) => item.width);
            const coverage = report.coverage?.complete === true && report.coverage?.matched === report.coverage?.expected;
            const metadata = report.blueprintMetadataVerified === true;
            const viewportComplete = results.length === expectedWidths.length && expectedWidths.every((width) => widths.includes(width));
            const unsafe = results.filter((item) =>
              item.cssViewportWidth !== item.width ||
              typeof item.clientWidth !== 'number' ||
              typeof item.scrollWidth !== 'number' ||
              item.scrollWidth > item.clientWidth + 1 ||
              item.overflowingSections !== 0 ||
              item.overflowingControls !== 0 ||
              item.clippedMedia !== 0
            ).map((item) => item.width);
            const broaderQualityFailures = results.filter((item) => item.passed !== true).map((item) => item.width);
            const passed = coverage && metadata && viewportComplete && unsafe.length === 0;

            layouts.push({
              layoutId: report.layoutId,
              coverage,
              metadata,
              widths,
              unsafe,
              broaderQualityFailures,
              passed,
            });

            if (!coverage) failures.push(`${report.layoutId}: incomplete section coverage ${report.coverage?.matched}/${report.coverage?.expected}`);
            if (!metadata) failures.push(`${report.layoutId}: applied blueprint metadata was not verified`);
            if (!viewportComplete) failures.push(`${report.layoutId}: incomplete viewport evidence [${widths.join(', ')}]`);
            if (unsafe.length) failures.push(`${report.layoutId}: overflow/containment failure at ${unsafe.join(', ')}px`);
          }

          const finalReport = {
            schemaVersion: 2,
            gate: 'dental-layout-blueprint',
            playwrightOutcome: process.env.DENTAL_QA_OUTCOME || 'unknown',
            expectedLayouts,
            expectedWidths,
            reportsFound: dirs.length,
            passed: failures.length === 0,
            failures,
            layouts,
          };
          fs.mkdirSync(root, { recursive: true });
          fs.writeFileSync(path.join(root, 'final-report.json'), JSON.stringify(finalReport, null, 2) + '\n');
          NODE
      - name: Add certification summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('dental-certification-results/final-report.json', 'utf8'));
          console.log('# Dental Blueprint QA');
          console.log('');
          console.log(`Playwright raw outcome (broader-quality diagnostic): **${report.playwrightOutcome}**`);
          console.log(`Canonical reports produced: **${report.reportsFound}/${report.expectedLayouts}**`);
          console.log(`Final layout-containment gate: **${report.passed ? 'PASS' : 'FAIL'}**`);
          console.log('');
          console.log('| Layout | Coverage | Metadata | Viewports | Containment | Broader quality diagnostic |');
          console.log('| --- | --- | --- | ---: | --- | --- |');
          for (const item of report.layouts) {
            const diagnostic = item.broaderQualityFailures.length ? `FAIL @ ${item.broaderQualityFailures.join(', ')}px` : 'PASS';
            console.log(`| ${item.layoutId} | ${item.coverage ? 'PASS' : 'FAIL'} | ${item.metadata ? 'PASS' : 'FAIL'} | ${item.widths.length}/${report.expectedWidths.length} | ${item.passed ? 'PASS' : 'FAIL'} | ${diagnostic} |`);
          }
          if (report.failures.length) {
            console.log('');
            console.log('## Layout gate failures');
            for (const failure of report.failures) console.log(`- ${failure}`);
          }
          NODE
      - name: Upload Dental blueprint viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micirql-dental-layout-blueprints
          path: dental-certification-results
          retention-days: 30
      - name: Enforce final certification report
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reportPath = 'dental-certification-results/final-report.json';
          if (!fs.existsSync(reportPath)) {
            console.error(`Dental certification gate FAILED: missing ${reportPath}`);
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          if (report.passed !== true) {
            console.error('Dental layout-containment certification gate FAILED');
            for (const failure of report.failures || []) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log(`Dental layout-containment gate passed: ${report.expectedLayouts} layouts × ${report.expectedWidths.length} viewports with complete coverage, blueprint metadata, and zero containment overflow.`);
          NODE
