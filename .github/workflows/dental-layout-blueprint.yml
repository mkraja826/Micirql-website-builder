name: Dental Layout Blueprint Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/builder/app/apply-layout-blueprint.ts"
      - "apps/builder/app/renderer-preview.tsx"
      - "apps/builder/app/layout.tsx"
      - "packages/design-engine/src/website-layout-blueprints.ts"
      - "packages/design-engine/src/dental-layout-blueprints.ts"
      - "packages/design-engine/src/layout-library.ts"
      - "packages/renderer/**"
      - "packages/sections/**"
      - "qa/dental-layout-blueprint*.spec.ts"
      - "playwright.dental-blueprint.config.ts"
      - "package.json"
      - ".github/workflows/dental-layout-blueprint.yml"
  push:
    branches: [main]
    paths:
      - "apps/builder/app/apply-layout-blueprint.ts"
      - "apps/builder/app/renderer-preview.tsx"
      - "apps/builder/app/layout.tsx"
      - "packages/design-engine/src/website-layout-blueprints.ts"
      - "packages/design-engine/src/dental-layout-blueprints.ts"
      - "packages/design-engine/src/layout-library.ts"
      - "packages/renderer/**"
      - "packages/sections/**"
      - "qa/dental-layout-blueprint*.spec.ts"
      - "playwright.dental-blueprint.config.ts"
      - "package.json"
      - ".github/workflows/dental-layout-blueprint.yml"

jobs:
  certify-blueprints:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck blueprint layers
        run: |
          pnpm --filter @micirql/design-engine typecheck
          pnpm --filter @micirql/sections typecheck
          pnpm --filter @micirql/renderer typecheck
          pnpm --filter @micirql/builder typecheck

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Certify curated Dental blueprints at six viewport widths
        run: pnpm qa:dental-blueprint

      - name: Add certification summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = require('path');
          const root = 'test-results';
          const dirs = fs.existsSync(root)
            ? fs.readdirSync(root).filter((name) => name.startsWith('dental-layout-blueprint-')).sort()
            : [];
          console.log('# Dental Blueprint QA');
          console.log('');
          if (!dirs.length) {
            console.log('No blueprint reports were produced.');
            process.exit(0);
          }
          console.log('| Layout | Coverage | Viewports | Overflow-safe |');
          console.log('| --- | ---: | ---: | --- |');
          for (const dir of dirs) {
            const reportPath = path.join(root, dir, 'report.json');
            if (!fs.existsSync(reportPath)) continue;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const safe = report.results.every((item) => item.passed);
            console.log(`| ${report.layoutId} | ${report.coverage.matched}/${report.coverage.expected} | ${report.results.length} | ${safe ? 'PASS' : 'FAIL'} |`);
          }
          NODE

      - name: Upload Dental blueprint viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micirql-dental-layout-blueprints
          path: test-results/dental-layout-blueprint-*
          retention-days: 30
