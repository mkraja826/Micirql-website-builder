name: Dental Premium Visual Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/builder/app/composition-intelligence.ts"
      - "apps/builder/app/apply-composition.ts"
      - "apps/builder/app/apply-layout-blueprint.ts"
      - "apps/builder/app/industry-pack-intelligence.ts"
      - "apps/builder/app/preset-ranking.ts"
      - "apps/builder/app/renderer-preview.tsx"
      - "apps/builder/app/editor-layout-guard.css"
      - "packages/design-engine/src/dental-layout-blueprints.ts"
      - "packages/sections/**"
      - "qa/dental-visual-comparison.spec.ts"
      - "qa/dental-top20-premium-gate.spec.ts"
      - "qa/dental-top20-visual-evidence.spec.ts"
      - "playwright.dental-visual.config.ts"
      - "package.json"
      - ".github/workflows/dental-visual-comparison.yml"
  push:
    branches: [main]
    paths:
      - "apps/builder/app/composition-intelligence.ts"
      - "apps/builder/app/apply-composition.ts"
      - "apps/builder/app/apply-layout-blueprint.ts"
      - "apps/builder/app/industry-pack-intelligence.ts"
      - "apps/builder/app/preset-ranking.ts"
      - "apps/builder/app/renderer-preview.tsx"
      - "apps/builder/app/editor-layout-guard.css"
      - "packages/design-engine/src/dental-layout-blueprints.ts"
      - "packages/sections/**"
      - "qa/dental-visual-comparison.spec.ts"
      - "qa/dental-top20-premium-gate.spec.ts"
      - "qa/dental-top20-visual-evidence.spec.ts"
      - "playwright.dental-visual.config.ts"
      - "package.json"
      - ".github/workflows/dental-visual-comparison.yml"

jobs:
  premium-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Dental Top-20 contract and visual evidence
        run: pnpm qa:dental-visual

      - name: Add visual benchmark summary
        if: always()
        run: |
          if [ -f test-results/dental-visual-comparison/summary.md ]; then
            cat test-results/dental-visual-comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f test-results/dental-top20-visual-evidence/summary.md ]; then
            cat test-results/dental-top20-visual-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micirql-dental-premium-visual-gate
          path: |
            test-results/dental-visual-comparison
            test-results/dental-top20-visual-evidence
            test-results/visual-review
          retention-days: 30
