name: Deploy Builder to Cloudflare

# Manual production trigger: 2026-08-20 14:48 IST
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/builder/**'
      - 'apps/live/**'
      - 'packages/ai/**'
      - 'packages/assets/**'
      - 'packages/components/**'
      - 'packages/design-engine/**'
      - 'packages/domains/**'
      - 'packages/functions/**'
      - 'packages/live-runtime/**'
      - 'packages/primitives/**'
      - 'packages/publisher/**'
      - 'packages/registry/**'
      - 'packages/renderer/**'
      - 'packages/schema/**'
      - 'packages/sections/**'
      - 'qa/dental-production-certification-gate.spec.ts'
      - 'qa/dental-top20-visual-evidence.spec.ts'
      - 'qa/dental-top20-implant-treatment-visual-evidence.spec.ts'
      - 'qa/dental-top20-implant-treatment-visual-evidence-contract.spec.ts'
      - 'qa/dental-top20-premium-gate.spec.ts'
      - 'qa/dental-top20-geometry-gate.spec.ts'
      - 'qa/dental-runtime-css-parity.spec.ts'
      - 'qa/dental-rendered-interaction-certification.spec.ts'
      - 'qa/live-rendered-interaction-parity.spec.ts'
      - 'qa/live-functional-interaction-certification.spec.ts'
      - 'qa/live-implant-treatment-render-parity.spec.ts'
      - 'qa/gallery-lightbox-certification.spec.ts'
      - 'qa/faq-accordion-certification.spec.ts'
      - 'qa/dental-faq-generation-intelligence.spec.ts'
      - 'qa/faq-structured-data-parity.spec.ts'
      - 'qa/dental-multipage-architecture.spec.ts'
      - 'qa/dental-multipage-media-safety.spec.ts'
      - 'qa/dental-multipage-layout-identity.spec.ts'
      - 'qa/dental-breadcrumb-structured-data.spec.ts'
      - 'qa/dental-multipage-live-routing.spec.ts'
      - 'qa/dental-content-auto-repair.spec.ts'
      - 'qa/dental-review-ranking.spec.ts'
      - 'qa/certify-dental-interactions.mjs'
      - 'qa/certify-dental-live-interactions.mjs'
      - 'qa/certify-dental-multipage.mjs'
      - 'qa/certify-dental-implant-treatment-visual.mjs'
      - 'qa/dental-interaction-allowlist-gate.spec.ts'
      - 'qa/dental-media-execution.spec.ts'
      - 'qa/site-visual-quality.spec.ts'
      - 'qa/perceptual-hash-upload-contract.spec.ts'
      - 'qa/certify-dental-top20-visual.mjs'
      - 'playwright.dental-visual.config.ts'
      - 'playwright.dental-diversity.config.ts'
      - 'package.json'
      - '.github/workflows/deploy-builder.yml'

permissions:
  contents: read

concurrency:
  group: micirql-builder-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MICIRQL_SUPABASE_SECRET_KEY: ${{ secrets.MICIRQL_SUPABASE_SECRET_KEY }}
      MICIRQL_LIBRARY_ADMIN_TOKEN: ${{ secrets.MICIRQL_LIBRARY_ADMIN_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://buodqfijzaqmzbkghche.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6HLaWSmycSxj3Dd2wKrcpg_Xw0ywbq7
      MICIRQL_DRAFT_STORE: supabase
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$MICIRQL_SUPABASE_SECRET_KEY" || { echo "Missing MICIRQL_SUPABASE_SECRET_KEY"; exit 1; }
          test -n "$MICIRQL_LIBRARY_ADMIN_TOKEN" || { echo "Missing MICIRQL_LIBRARY_ADMIN_TOKEN"; exit 1; }
          test -n "$PEXELS_API_KEY" || { echo "Missing PEXELS_API_KEY"; exit 1; }

      - name: Verify live Pexels API
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /tmp/pexels-smoke.json --write-out '%{http_code}' \
            --header "Authorization: $PEXELS_API_KEY" \
            'https://api.pexels.com/v1/search?query=dental%20clinic&orientation=landscape&size=large&per_page=1&page=1')
          if [ "$status" != "200" ]; then
            echo "Pexels API smoke test failed with HTTP $status"
            head -c 300 /tmp/pexels-smoke.json || true
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/pexels-smoke.json', 'utf8'));
          const photo = Array.isArray(payload.photos) ? payload.photos[0] : null;
          if (!photo?.id || !photo?.src || !(photo.src.large2x || photo.src.large || photo.src.original)) {
            throw new Error('Pexels API returned HTTP 200 but no usable image result.');
          }
          console.log(`Pexels live smoke check passed (photo ${photo.id}).`);
          NODE

      - run: pnpm install --no-frozen-lockfile

      - name: Typecheck Builder before certification
        run: pnpm --filter @micirql/builder typecheck

      - name: Install Chromium for premium visual certification
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Dental generation intelligence
        run: pnpm qa:dental-diversity

      - name: Certify Dental Top-20 rendered output
        run: pnpm qa:dental-visual

      - name: Verify runtime Dental certification allowlist
        shell: bash
        run: |
          test -n "$MICIRQL_DENTAL_CERTIFIED_LAYOUT_IDS" || { echo "Rendered Dental certification did not produce a runtime allowlist"; exit 1; }
          count=$(printf '%s\n' "$MICIRQL_DENTAL_CERTIFIED_LAYOUT_IDS" | tr ',' '\n' | sed '/^$/d' | wc -l | tr -d ' ')
          test "$count" = "20" || { echo "Expected 20 rendered-certified Dental layouts, got $count"; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const file = 'test-results/dental-top20-visual-evidence/certification.json';
          if (!fs.existsSync(file)) throw new Error('Missing final Dental certification artifact');
          const certification = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (certification.schemaVersion !== 11) throw new Error(`Unexpected Dental certification schema ${certification.schemaVersion}`);
          if (certification.certified !== true) throw new Error('Dental certification artifact is not certified');
          if (certification.sourceCommit !== process.env.GITHUB_SHA) throw new Error(`Dental certification is stale: ${certification.sourceCommit} != ${process.env.GITHUB_SHA}`);
          if (certification.requiredInteractionContract !== 'shared-dental-rendered-interaction-v1') throw new Error('Rendered interaction contract is missing from final certification');
          if (certification.requiredLiveInteractionContract !== 'published-live-functional-gallery-faq-implant-render-v6') throw new Error('Published live implant-render contract is missing from final certification');
          if (certification.requiredMultipageContract !== 'dental-multipage-architecture-v1') throw new Error('Dental multi-page architecture contract is missing from final certification');
          if (certification.requiredTreatmentVisualContract !== 'dental-top20-implant-treatment-six-viewport-v1') throw new Error('Dental Implants six-viewport visual contract is missing from final certification');
          if (!Array.isArray(certification.layouts) || certification.layouts.length !== 20) throw new Error('Final certification does not contain all 20 layouts');
          const failed = certification.layouts.filter((entry) => entry.passed !== true || entry.interactionCertified !== true || entry.liveInteractionCertified !== true || entry.liveFunctionalInteractionCertified !== true || entry.liveImplantRenderCertified !== true || entry.galleryInteractionCertified !== true || entry.faqInteractionCertified !== true || entry.faqStructuredDataCertified !== true || entry.multipageCertified !== true || entry.implantTreatmentVisualCertified !== true);
          if (failed.length) throw new Error(`Layouts missing Builder/live/multi-page/implant-treatment certification: ${failed.map((entry) => entry.layoutId).join(', ')}`);
          console.log('All 20 runtime Dental layouts are homepage + published-live implant render + multi-page + six-viewport Dental Implants certified for this commit.');
          NODE

      - name: Build and deploy builder
        run: pnpm --filter @micirql/builder run deploy

      - name: Upload rendered Dental certification allowlist to Builder Worker
        working-directory: apps/builder
        shell: bash
        run: printf '%s' "$MICIRQL_DENTAL_CERTIFIED_LAYOUT_IDS" | pnpm exec wrangler secret put MICIRQL_DENTAL_CERTIFIED_LAYOUT_IDS

      - name: Upload Supabase server secret to Builder Worker
        working-directory: apps/builder
        shell: bash
        run: printf '%s' "$MICIRQL_SUPABASE_SECRET_KEY" | pnpm exec wrangler secret put MICIRQL_SUPABASE_SECRET_KEY

      - name: Upload Dental library admin token to Builder Worker
        working-directory: apps/builder
        shell: bash
        run: printf '%s' "$MICIRQL_LIBRARY_ADMIN_TOKEN" | pnpm exec wrangler secret put MICIRQL_LIBRARY_ADMIN_TOKEN

      - name: Upload Pexels API key to Builder Worker
        working-directory: apps/builder
        shell: bash
        run: printf '%s' "$PEXELS_API_KEY" | pnpm exec wrangler secret put PEXELS_API_KEY

      - name: Verify deployed Builder Pexels runtime
        shell: bash
        run: |
          url='https://micirql-website-builder.karthikraja826.workers.dev/api/admin/pexels-health'
          status='000'
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --output /tmp/pexels-runtime.json --write-out '%{http_code}' \
              --header "x-micirql-library-token: $MICIRQL_LIBRARY_ADMIN_TOKEN" \
              "$url" || true)
            [ "$status" = "200" ] && break
            echo "Pexels runtime health attempt $attempt returned HTTP $status; waiting for Worker propagation..."
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "Deployed Builder Pexels runtime check failed with HTTP $status"
            head -c 600 /tmp/pexels-runtime.json || true
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/pexels-runtime.json', 'utf8'));
          if (payload.ok !== true || payload.provider !== 'pexels' || !payload.photoId || !Number.isFinite(payload.bytes) || payload.bytes <= 0 || !payload.width || !payload.height) {
            throw new Error(`Deployed Builder returned an invalid Pexels health payload: ${JSON.stringify(payload).slice(0, 500)}`);
          }
          console.log(`Deployed Builder Pexels runtime passed (photo ${payload.photoId}, ${payload.width}x${payload.height}, ${payload.bytes} bytes).`);
          NODE

      - name: Upload premium certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micirql-builder-production-certification
          path: |
            test-results/dental-top20-visual-evidence
            test-results/dental-top20-implant-treatment-visual-evidence
            test-results/dental-visual-comparison
          retention-days: 30
