name: Deploy Builder to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/builder/**'
      - 'packages/ai/**'
      - 'packages/assets/**'
      - 'packages/components/**'
      - 'packages/design-engine/**'
      - 'packages/domains/**'
      - 'packages/functions/**'
      - 'packages/primitives/**'
      - 'packages/publisher/**'
      - 'packages/registry/**'
      - 'packages/renderer/**'
      - 'packages/schema/**'
      - 'packages/sections/**'
      - 'packages/workspace/**'
      - '.github/workflows/deploy-builder.yml'

permissions:
  contents: read

concurrency:
  group: micirql-builder-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MICIRQL_SUPABASE_SECRET_KEY: ${{ secrets.MICIRQL_SUPABASE_SECRET_KEY }}
      MICIRQL_LIBRARY_ADMIN_TOKEN: ${{ secrets.MICIRQL_LIBRARY_ADMIN_TOKEN }}
      MICIRQL_BFL_API_KEY: ${{ secrets.MICIRQL_BFL_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://buodqfijzaqmzbkghche.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6HLaWSmycSxj3Dd2wKrcpg_Xw0ywbq7
      MICIRQL_DRAFT_STORE: supabase
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$MICIRQL_SUPABASE_SECRET_KEY" || { echo "Missing MICIRQL_SUPABASE_SECRET_KEY"; exit 1; }

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @micirql/builder typecheck

      - name: Build and deploy builder
        run: pnpm --filter @micirql/builder run deploy

      - name: Upload Supabase server secret to Builder Worker
        working-directory: apps/builder
        shell: bash
        run: printf '%s' "$MICIRQL_SUPABASE_SECRET_KEY" | pnpm exec wrangler secret put MICIRQL_SUPABASE_SECRET_KEY

      - name: Upload Dental library admin token to Builder Worker
        if: ${{ env.MICIRQL_LIBRARY_ADMIN_TOKEN != '' }}
        working-directory: apps/builder
        shell: bash
        run: printf '%s' "$MICIRQL_LIBRARY_ADMIN_TOKEN" | pnpm exec wrangler secret put MICIRQL_LIBRARY_ADMIN_TOKEN

      - name: Upload BFL image API key to Builder Worker
        if: ${{ env.MICIRQL_BFL_API_KEY != '' }}
        working-directory: apps/builder
        shell: bash
        run: printf '%s' "$MICIRQL_BFL_API_KEY" | pnpm exec wrangler secret put MICIRQL_BFL_API_KEY
