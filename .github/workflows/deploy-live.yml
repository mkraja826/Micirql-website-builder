name: Deploy Live to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/live/**'
      - 'packages/functions/**'
      - 'packages/live-runtime/**'
      - 'packages/renderer/**'
      - 'packages/schema/**'
      - '.github/workflows/deploy-live.yml'

permissions:
  contents: read

concurrency:
  group: micirql-live-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MICIRQL_SUPABASE_SECRET_KEY: ${{ secrets.MICIRQL_SUPABASE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$MICIRQL_SUPABASE_SECRET_KEY" || { echo "Missing MICIRQL_SUPABASE_SECRET_KEY"; exit 1; }

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @micirql/live typecheck
      - run: pnpm --filter @micirql/live exec opennextjs-cloudflare build

      - name: Deploy micirql-live
        run: pnpm --filter @micirql/live run deploy

      - name: Upload Supabase server secret to Worker
        working-directory: apps/live
        shell: bash
        run: printf '%s' "$MICIRQL_SUPABASE_SECRET_KEY" | pnpm exec wrangler secret put MICIRQL_SUPABASE_SECRET_KEY

      - name: Upload optional Resend API secret to Worker
        if: ${{ env.RESEND_API_KEY != '' }}
        working-directory: apps/live
        shell: bash
        run: printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY

      - name: Upload optional Resend sender to Worker
        if: ${{ env.RESEND_FROM != '' }}
        working-directory: apps/live
        shell: bash
        run: printf '%s' "$RESEND_FROM" | pnpm exec wrangler secret put RESEND_FROM
