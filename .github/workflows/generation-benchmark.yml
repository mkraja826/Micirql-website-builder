name: Generation Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/schema/**"
      - "packages/design-engine/**"
      - "packages/ai/**"
      - "apps/builder/app/**"
      - "qa/generation-benchmark.spec.ts"
      - "playwright.benchmark.config.ts"
      - "package.json"
      - ".github/workflows/generation-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "packages/schema/**"
      - "packages/design-engine/**"
      - "packages/ai/**"
      - "apps/builder/app/**"
      - "qa/generation-benchmark.spec.ts"
      - "playwright.benchmark.config.ts"
      - "package.json"
      - ".github/workflows/generation-benchmark.yml"

jobs:
  dental-generation-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run deterministic dental generation benchmark
        run: pnpm qa:generation-benchmark

      - name: Add benchmark summary
        if: always()
        run: |
          if [ -f test-results/generation-benchmark/summary.md ]; then
            cat test-results/generation-benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micirql-generation-benchmark
          path: test-results/generation-benchmark
          retention-days: 30
