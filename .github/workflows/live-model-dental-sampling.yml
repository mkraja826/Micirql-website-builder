name: Live Model Dental Sampling

on:
  workflow_dispatch:
    inputs:
      sample_count:
        description: "Number of dental scenarios to sample (1-6)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]
  push:
    branches: [main]
    paths:
      - "qa/live-dental-customer-path.spec.ts"
      - ".github/workflows/live-model-dental-sampling.yml"

permissions:
  contents: read

jobs:
  live-dental-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      MI_LIVE_SAMPLE_COUNT: ${{ inputs.sample_count || '3' }}
      MICIRQL_TEXT_MODEL_ENDPOINT: ${{ secrets.MICIRQL_TEXT_MODEL_ENDPOINT }}
      MICIRQL_TEXT_MODEL_API_KEY: ${{ secrets.MICIRQL_TEXT_MODEL_API_KEY }}
      MICIRQL_TEXT_MODEL: ${{ secrets.MICIRQL_TEXT_MODEL }}
      MICIRQL_TEXT_MODEL_PROFILE_ID: ${{ secrets.MICIRQL_TEXT_MODEL_PROFILE_ID }}
      MICIRQL_TEXT_MODEL_INPUT_USD_PER_MILLION: ${{ secrets.MICIRQL_TEXT_MODEL_INPUT_USD_PER_MILLION || '0' }}
      MICIRQL_TEXT_MODEL_OUTPUT_USD_PER_MILLION: ${{ secrets.MICIRQL_TEXT_MODEL_OUTPUT_USD_PER_MILLION || '0' }}
      MICIRQL_TEXT_MODEL_TEMPERATURE: "0.2"
      MICIRQL_TEXT_MODEL_MAX_OUTPUT_TOKENS: "8000"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Provider and media preflight
        id: preflight
        shell: bash
        run: |
          code="OK"
          detail="Live text provider and Pexels prerequisites are configured."

          if [[ -z "$MICIRQL_TEXT_MODEL_API_KEY" && -z "$GEMINI_API_KEY" ]]; then
            code="LIVE_PROVIDER_MISSING"
            detail="No live text-model secret is configured. Add MICIRQL_TEXT_MODEL_* or GEMINI_API_KEY."
          elif [[ -n "$MICIRQL_TEXT_MODEL_API_KEY" && ( -z "$MICIRQL_TEXT_MODEL_ENDPOINT" || -z "$MICIRQL_TEXT_MODEL" ) ]]; then
            code="LIVE_PROVIDER_INCOMPLETE"
            detail="MICIRQL_TEXT_MODEL_API_KEY is present but endpoint/model configuration is incomplete."
          elif [[ -z "$PEXELS_API_KEY" ]]; then
            code="PEXELS_KEY_MISSING"
            detail="PEXELS_API_KEY is required for live generated-site visual QA."
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "## Live Dental benchmark preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Code: **$code**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detail: $detail" >> "$GITHUB_STEP_SUMMARY"
          echo "- Samples: **$MI_LIVE_SAMPLE_COUNT**" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$code" != "OK" ]]; then
            echo "::error title=$code::$detail"
            exit 1
          fi

      - name: Run live Dental content, visual, media and customer-path sampling
        run: pnpm qa:live-model-dental

      - name: Run live autonomous composition sampling
        run: pnpm qa:live-autonomous-composition

      - name: Add model quality summary
        if: always()
        shell: bash
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Live Dental benchmark diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preflight: **${{ steps.preflight.outputs.code || 'NOT_REACHED' }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: **${GITHUB_SHA}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: **${GITHUB_EVENT_NAME}**" >> "$GITHUB_STEP_SUMMARY"

          found=0
          for report in \
            test-results/live-model-dental/summary.md \
            test-results/live-generated-dental-visual/summary.md \
            test-results/live-dental-media-materialization/summary.md \
            test-results/live-dental-customer-path/summary.md; do
            if [[ -f "$report" ]]; then
              found=1
              echo "" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ "$found" == "0" ]]; then
            echo "- Evidence summaries: **NONE_PRODUCED**" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f test-results/live-autonomous-composition/report.json ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Autonomous composition sampling" >> "$GITHUB_STEP_SUMMARY"
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("test-results/live-autonomous-composition/report.json","utf8"));console.log(`- Model: **${r.modelId}**\n- AI acceptance: **${Math.round(r.acceptanceRate*100)}%** (${r.aiAccepted}/${r.scenarios})\n- Composition pass rate: **${Math.round(r.passRate*100)}%**`)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micirql-live-dental-model-${{ github.run_number }}
          path: |
            test-results/live-model-dental/
            test-results/live-generated-dental-visual/
            test-results/live-dental-media-materialization/
            test-results/live-dental-customer-path/
            test-results/live-autonomous-composition/
          if-no-files-found: warn
          retention-days: 14
