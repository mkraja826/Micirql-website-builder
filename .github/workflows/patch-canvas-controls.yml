name: Patch canvas quick controls

on:
  push:
    paths:
      - .github/workflows/patch-canvas-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire canvas quick actions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/builder/app/workspace-client.tsx')
          text = path.read_text()
          old = 'onRequestImageChange={(sectionId)=>{selectSection(activePage.id,sectionId);setMode("images")}} onReorderSection={(sectionId,toIndex)=>commit({type:"section.reorder",pageId:activePage.id,sectionId,toIndex})}'
          new = 'onRequestImageChange={(sectionId)=>{selectSection(activePage.id,sectionId);setMode("images")}} onRequestDesignChange={(sectionId)=>{selectSection(activePage.id,sectionId);setMode("design")}} onRequestCopyEdit={(sectionId)=>{selectSection(activePage.id,sectionId);setMode("content")}} onRequestMove={(sectionId,direction)=>{const index=activePage.sections.findIndex(item=>item.id===sectionId);if(index<0)return;const toIndex=direction==="up"?Math.max(0,index-1):Math.min(activePage.sections.length-1,index+1);commit({type:"section.reorder",pageId:activePage.id,sectionId,toIndex})}} onRequestVisibility={(sectionId,hidden)=>{selectSection(activePage.id,sectionId);commit({type:"section.hidden.set",pageId:activePage.id,sectionId,hidden})}} onReorderSection={(sectionId,toIndex)=>commit({type:"section.reorder",pageId:activePage.id,sectionId,toIndex})}'
          if old not in text:
              raise SystemExit('Expected RendererPreview callback sequence not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "micirql-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/builder/app/workspace-client.tsx
          git commit -m "Wire in-canvas section quick actions"
          git push origin HEAD:main
