name: Patch canvas section insertion

on:
  push:
    paths:
      - .github/workflows/patch-canvas-section-insert.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire canvas section insertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/builder/app/workspace-client.tsx')
          text = path.read_text()

          old_import = 'import { AiEditorAssistant } from "./ai-editor-assistant";\n'
          new_import = old_import + 'import { CanvasAddSectionFlow } from "./canvas-add-section-flow";\n'
          if old_import not in text:
              raise SystemExit('AI assistant import not found; refusing unsafe patch')
          text = text.replace(old_import, new_import, 1)

          old_state = ' const [conflictDraft,setConflictDraft]=useState<DraftApiRecord>();\n'
          new_state = old_state + ' const [canvasInsert,setCanvasInsert]=useState<{afterSectionId?:string}>();\n'
          if old_state not in text:
              raise SystemExit('Conflict state not found; refusing unsafe patch')
          text = text.replace(old_state, new_state, 1)

          marker = '<RendererPreview '
          if marker not in text:
              raise SystemExit('RendererPreview not found; refusing unsafe patch')
          flow = '{canvasInsert?<CanvasAddSectionFlow site={state.site} pageId={activePage.id} afterSectionId={canvasInsert.afterSectionId} onCancel={()=>setCanvasInsert(undefined)} onChoose={(family,candidate)=>{const id=`${family}-${crypto.randomUUID().slice(0,8)}`;const section:SiteSection={id,component:{componentId:candidate.componentId,version:candidate.version},props:seedSectionProps(family),bindings:{},hidden:false};const anchor=canvasInsert.afterSectionId;const anchorIndex=anchor?activePage.sections.findIndex(item=>item.id===anchor):-1;const toIndex=anchor?Math.max(0,anchorIndex+1):0;commit({type:"section.add",pageId:activePage.id,section,toIndex});setCanvasInsert(undefined);selectSection(activePage.id,id);setMode("content")}}/>:null}'
          text = text.replace(marker, flow + marker, 1)

          old_callbacks = 'onRequestVisibility={(sectionId,hidden)=>{selectSection(activePage.id,sectionId);commit({type:"section.hidden.set",pageId:activePage.id,sectionId,hidden})}} onReorderSection='
          new_callbacks = 'onRequestVisibility={(sectionId,hidden)=>{selectSection(activePage.id,sectionId);commit({type:"section.hidden.set",pageId:activePage.id,sectionId,hidden})}} onRequestAddSection={(afterSectionId)=>setCanvasInsert({...(afterSectionId?{afterSectionId}:{})})} onReorderSection='
          if old_callbacks not in text:
              raise SystemExit('RendererPreview visibility callback not found; refusing unsafe patch')
          text = text.replace(old_callbacks, new_callbacks, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "micirql-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/builder/app/workspace-client.tsx
          git commit -m "Wire canvas section insertion flow"
          git push origin HEAD:main
