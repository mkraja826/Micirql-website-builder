name: Patch logo palette onboarding

on:
  push:
    paths:
      - .github/workflows/patch-logo-palette-onboarding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use all semantic logo palette roles
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/builder/app/api/onboarding/route.ts')
          text = path.read_text()
          old = "        const [primary, accent, secondary] = advice.brandColors;\n        if (primary || accent || secondary) {\n          nextSnapshot.theme.brand.colors = {\n            ...nextSnapshot.theme.brand.colors,\n            ...(primary ? { primary } : {}),\n            ...(accent ? { accent } : {}),\n            ...(secondary ? { secondary } : {}),\n          };\n        }"
          new = "        const [primary, accent, secondary, surface, border] = advice.brandColors;\n        if (primary || accent || secondary || surface || border) {\n          nextSnapshot.theme.brand.colors = {\n            ...nextSnapshot.theme.brand.colors,\n            ...(primary ? { primary } : {}),\n            ...(accent ? { accent } : {}),\n            ...(secondary ? { secondary, textPrimary: secondary } : {}),\n            ...(surface ? { surface } : {}),\n            ...(border ? { border } : {}),\n          };\n        }"
          if old not in text:
              raise SystemExit('Expected palette block not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "micirql-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/builder/app/api/onboarding/route.ts
          git commit -m "Use semantic logo palette across generated themes"
          git push origin HEAD:main
