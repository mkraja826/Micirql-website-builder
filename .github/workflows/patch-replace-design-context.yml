name: Patch replace design context

on:
  push:
    paths:
      - .github/workflows/patch-replace-design-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch replacement context
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path('apps/builder/app/workspace-client.tsx')
          text = workspace.read_text()
          old = '<SectionDesignSwitcher family={activeSectionFamily} theme={state.site.theme.family} currentComponentId={activeSection.component.componentId} onSelect={(componentId,version)=>commit({type:"section.component.set",pageId:activePage.id,sectionId:activeSection.id,componentId,version})}/>'
          new = '<SectionDesignSwitcher site={state.site} pageId={activePage.id} section={activeSection} family={activeSectionFamily} theme={state.site.theme.family} currentComponentId={activeSection.component.componentId} onSelect={(componentId,version)=>commit({type:"section.component.set",pageId:activePage.id,sectionId:activeSection.id,componentId,version})}/>'
          if old not in text:
              raise SystemExit('Expected SectionDesignSwitcher call not found; refusing unsafe patch')
          workspace.write_text(text.replace(old, new, 1))

          picker = Path('apps/builder/app/section-composition-picker.tsx')
          text = picker.read_text()
          needle = 'function previewProps(family: AiEditorSectionFamily, siteName: string): SeedProps {\n'
          insert = 'function previewProps(family: AiEditorSectionFamily, siteName: string): SeedProps {\n  if (family === "hero") return { eyebrow: "Welcome", title: siteName, description: "A clear, confident introduction that explains what this business offers and why visitors should continue.", primaryAction: { label: "Get started", href: "#contact" } };\n'
          if needle not in text:
              raise SystemExit('Expected previewProps function not found; refusing unsafe patch')
          picker.write_text(text.replace(needle, insert, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "micirql-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/builder/app/workspace-client.tsx apps/builder/app/section-composition-picker.tsx
          git commit -m "Wire contextual replace-design previews"
          git push origin HEAD:main
