name: Resend Notification E2E

on:
  push:
    paths:
      - '.github/workflows/resend-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Submit one live enquiry for notification test
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          code=$(curl -sS --max-time 30 -o /dev/null -D "$headers" -w '%{http_code}' \
            -X POST 'https://micirql-live.karthikraja826.workers.dev/api/functions/lead.create' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H "Idempotency-Key: micirql-resend-${GITHUB_RUN_ID}" \
            --data-urlencode 'name=MiCirql Resend E2E' \
            --data-urlencode 'email=e2e-notify@example.com' \
            --data-urlencode 'message=Automated Resend notification verification' \
            --data-urlencode 'consent=true' \
            --data-urlencode 'sourcePage=/')
          echo "HTTP $code"
          cat "$headers"
          test "$code" = '303'
          grep -Eiq '^location: .*\?form=received.*#enquiry' "$headers"
