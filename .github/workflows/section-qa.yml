name: Section QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/primitives/**"
      - "packages/components/**"
      - "packages/sections/**"
      - "packages/themes/**"
      - "apps/preview/**"
      - "qa/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/section-qa.yml"
  push:
    branches: [main]
    paths:
      - "packages/primitives/**"
      - "packages/components/**"
      - "packages/sections/**"
      - "packages/themes/**"
      - "apps/preview/**"
      - "qa/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/section-qa.yml"

jobs:
  section-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run representative section QA
        run: pnpm qa:sections

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micirql-section-qa
          path: |
            playwright-report
            test-results
          retention-days: 14
