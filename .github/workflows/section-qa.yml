name: Section QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/primitives/**"
      - "packages/components/**"
      - "packages/sections/**"
      - "packages/themes/**"
      - "packages/registry/**"
      - "apps/preview/**"
      - "qa/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/section-qa.yml"
  push:
    branches: [main]
    paths:
      - "packages/primitives/**"
      - "packages/components/**"
      - "packages/sections/**"
      - "packages/themes/**"
      - "packages/registry/**"
      - "apps/preview/**"
      - "qa/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/section-qa.yml"

jobs:
  section-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run premium core section QA
        run: pnpm qa:sections:core

      - name: Build registry QA evidence
        if: always()
        run: pnpm qa:sections:evidence

      - name: Build certification report
        if: always()
        run: pnpm qa:sections:certification

      - name: Build visual review queue
        if: always()
        run: pnpm qa:sections:visual-review

      - name: Add certification summary
        if: always()
        run: |
          cat test-results/certification/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat test-results/visual-review/review-guide.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micirql-section-qa
          path: |
            playwright-report
            test-results
          retention-days: 14
