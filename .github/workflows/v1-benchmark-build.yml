name: V1 Benchmark Build

on:
  push:
    branches:
      - 'v1/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Enforce generic core section boundaries
        run: node scripts/check-core-section-coupling.mjs
      - name: Enforce generic core specialization boundary
        run: node scripts/check-core-specialization-boundary.mjs
      - name: Build Next benchmark
        run: npm run build
      - name: Build Cloudflare target
        run: npm run build:cloudflare
      - name: Install screenshot runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start benchmark
        run: |
          npm run start > /tmp/micirql-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/micirql-next.log
          exit 1
      - name: Capture visual baselines
        run: node scripts/capture-benchmark.mjs
      - name: Audit universal section archetype usage
        run: node scripts/audit-section-archetype-usage.mjs
      - name: Audit rendered candidates
        run: node scripts/audit-rendered-candidates.mjs
      - name: Audit rendered multi-industry candidates
        run: node scripts/audit-multi-industry-rendered.mjs
      - name: Audit multi-industry content plans
        run: node scripts/audit-multi-industry-content.mjs
      - name: Score perceptual quality
        run: node scripts/score-perceptual-candidates.mjs
      - name: Compose final candidate ranking
        run: node scripts/compose-final-ranking.mjs
      - name: Upload Pearl benchmark screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pearl-dental-benchmark-screenshots
          path: artifacts/benchmark/*.png
      - name: Upload section lab screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v1-section-lab-screenshots
          path: artifacts/section-lab/*.png
      - name: Upload generated Pearl screenshots
        uses: actions/upload-artifact@v4
        with:
          name: generated-pearl-screenshots
          path: artifacts/generated-pearl/*.png
      - name: Upload Pearl candidate gallery screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pearl-candidate-gallery-screenshots
          path: artifacts/pearl-candidates/*.png
      - name: Upload rendered Pearl candidate screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pearl-rendered-candidate-screenshots
          path: artifacts/pearl-rendered-candidates/*.png
      - name: Upload rendered multi-industry screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-industry-rendered-screenshots
          path: artifacts/multi-industry-rendered/*.png
      - name: Upload section archetype usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-archetype-usage
          path: artifacts/section-archetype-usage/report.json
      - name: Upload rendered candidate audit
        uses: actions/upload-artifact@v4
        with:
          name: pearl-rendered-candidate-audit
          path: artifacts/pearl-render-audit/report.json
      - name: Upload multi-industry rendered audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-industry-rendered-audit
          path: artifacts/multi-industry-render-audit/report.json
      - name: Upload multi-industry content audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-industry-content-audit
          path: artifacts/multi-industry-content-audit/report.json
      - name: Upload perceptual candidate ranking
        uses: actions/upload-artifact@v4
        with:
          name: pearl-perceptual-candidate-ranking
          path: artifacts/pearl-perceptual-ranking/report.json
      - name: Upload final candidate ranking
        uses: actions/upload-artifact@v4
        with:
          name: pearl-final-candidate-ranking
          path: artifacts/pearl-final-ranking/report.json
