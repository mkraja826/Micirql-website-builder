name: V1 Materialized Revisions

on:
  pull_request:
    paths:
      - 'src/core/materialization/**'
      - 'src/core/persistence/**'
      - 'supabase/migrations/**'
      - 'scripts/audit-materialized-revisions.mjs'
      - 'scripts/audit-persisted-revision-rpc.mjs'
      - 'scripts/certify-materialized-revision-lifecycle.ts'
      - '.github/workflows/v1-materialized-revisions.yml'
  workflow_dispatch:

jobs:
  materialized-revision-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit immutable materialized revisions
        run: node scripts/audit-materialized-revisions.mjs

      - name: Audit immutable persistence RPC
        run: node scripts/audit-persisted-revision-rpc.mjs

      - name: Execute V1 to V2 to V1 lifecycle
        run: npx tsx scripts/certify-materialized-revision-lifecycle.ts

      - name: Upload revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialized-revision-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/materialized-revision-audit/report.json
            artifacts/persisted-revision-rpc-audit/report.json
            artifacts/materialized-revision-lifecycle/report.json
          if-no-files-found: error
