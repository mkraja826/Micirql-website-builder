name: V1 Persisted Publication Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-persisted-publication-certification
  cancel-in-progress: false

jobs:
  certify-persisted-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-certification
    env:
      SUPABASE_URL: ${{ secrets.MICIRQL_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.MICIRQL_SUPABASE_ANON_KEY }}
      MICIRQL_CERTIFICATION_ACCESS_TOKEN: ${{ secrets.MICIRQL_CERTIFICATION_ACCESS_TOKEN }}
      MICIRQL_CERTIFICATION_WORKSPACE_ID: ${{ secrets.MICIRQL_CERTIFICATION_WORKSPACE_ID }}
      MICIRQL_CERTIFICATION_ACTOR_ID: ${{ secrets.MICIRQL_CERTIFICATION_ACTOR_ID }}
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require protected certification credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_ANON_KEY MICIRQL_CERTIFICATION_ACCESS_TOKEN MICIRQL_CERTIFICATION_WORKSPACE_ID MICIRQL_CERTIFICATION_ACTOR_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required protected certification secret: $name"
              exit 1
            fi
          done

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Start certification server
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/micirql-persisted-certification.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/generated/benchmarks/restaurant/candidate-01 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/micirql-persisted-certification.log
          exit 1

      - name: Produce genuine post-repair certification evidence
        run: |
          node scripts/audit-real-certification-rendered.mjs
          node scripts/plan-real-certification-repairs.mjs
          node scripts/audit-real-certification-post-repair.mjs
          node scripts/compose-real-certification-ranking.mjs

      - name: Materialize genuine certified winners
        run: |
          mkdir -p .tmp/real-certification-materializer
          ./node_modules/esbuild/bin/esbuild scripts/materialize-real-certification-winners.ts --bundle --platform=node --format=esm --target=node22 --outfile=.tmp/real-certification-materializer/run.mjs
          node .tmp/real-certification-materializer/run.mjs

      - name: Prepare immutable V1 and pending V2
        run: npx tsx scripts/prepare-persisted-publication-certification.ts

      - name: Audit exact pending V2 through canonical renderer
        run: node scripts/audit-exact-materialized-revision.mjs

      - name: Bind V2 certification to exact audited fingerprint
        run: npx tsx scripts/certify-exact-materialized-revision.ts

      - name: Certify authenticated Supabase V1 to V2 to rollback lifecycle
        run: npx tsx scripts/certify-supabase-publication-lifecycle.ts

      - name: Upload persisted publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persisted-publication-certification-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/real-certification-render-audit/report.json
            artifacts/real-certification-repair-plans/report.json
            artifacts/real-certification-post-repair-audit/report.json
            artifacts/real-certification-final-ranking/report.json
            artifacts/real-certification-materialized-winners/report.json
            artifacts/persisted-publication-certification/prepared.json
            artifacts/persisted-publication-certification/revision-evidence.json
            artifacts/persisted-publication-certification/input.json
            artifacts/persisted-publication-certification/report.json
