name: V1 Published Functional Certification

on:
  pull_request:
    paths:
      - "src/core/publish/**"
      - "src/core/persistence/**"
      - "app/published/**"
      - "scripts/audit-published-functional-certification.mjs"
      - ".github/workflows/v1-published-functional-certification.yml"
  workflow_dispatch:

jobs:
  certification-boundary:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit published functional certification
        run: node scripts/audit-published-functional-certification.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
