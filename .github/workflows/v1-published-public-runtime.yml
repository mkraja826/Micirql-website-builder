name: V1 Published Public Runtime

on:
  push:
    branches:
      - v1/published-runtime-integration
  pull_request:
    paths:
      - "app/published/**"
      - "src/core/publish/**"
      - "src/core/persistence/**"
      - "src/rendering/published-snapshot.tsx"
      - "scripts/audit-published-public-runtime.mjs"
      - ".github/workflows/v1-published-public-runtime.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit canonical published public runtime
        run: node scripts/audit-published-public-runtime.mjs
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck canonical runtime
        run: npx tsc --noEmit
      - name: Build application
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
        run: npm run build
