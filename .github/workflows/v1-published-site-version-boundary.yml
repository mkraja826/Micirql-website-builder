name: V1 Published Site Version Boundary

on:
  push:
    branches:
      - v1/canonical-published-site-renderer
  pull_request:
    paths:
      - "src/core/persistence/**"
      - "scripts/audit-published-site-version-boundary.mjs"
      - ".github/workflows/v1-published-site-version-boundary.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit published site version boundary
        run: node scripts/audit-published-site-version-boundary.mjs
